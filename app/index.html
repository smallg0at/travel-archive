<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Photo Archive</title>
    <link rel="icon" type="image/svg+xml" href="/brand/app-icon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
    <script>
      // Before the stylesheet paints, not from a module. A reader who chose
      // dark on a light system would otherwise see the page render light and
      // then flip — the flash is more objectionable than the setting is useful.
      // Absence of the attribute means "system", which the media query handles.
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        /* storage blocked; the system preference still applies */
      }
    </script>
  </head>
  <body>
    <!-- Transient notes, stacked in one place: the sign-in prompt and the
         local server's state (serverStatus.ts). One host so two of them at
         once — the common case, server away *and* reader signed out — stack
         instead of covering each other, and so neither can land in the title
         band under the fixed search field. -->
    <div id="toasts">
      <div id="signin-banner" class="signin-banner" hidden>
        <span>Sign in to load your photos.</span>
        <button id="signin-button" type="button">Sign in with Microsoft</button>
      </div>
    </div>

    <div id="app">
      <!-- Backdrop scrim for narrow-screen overlay drawer mode -->
      <div id="sidebar-scrim" class="sidebar-scrim"></div>

      <!-- The nav is rebuilt on every album render; the job panel must not be,
           or a finished job's result line and the form you just filled in are
           wiped the moment it completes. Hence a sibling host. -->
      <aside id="sidebar">
        <!-- Top-left brand header for WCO titlebar area in desktop shell -->
        <div id="sidebar-header" class="sidebar-header">
          <button id="nav-toggle" class="nav-toggle-btn" type="button" aria-label="Toggle navigation" title="Toggle navigation (Ctrl+B)">
            <svg class="nav-toggle-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2.75 18h18.5a.75.75 0 0 1 .1 1.5H2.75a.75.75 0 0 1-.1-1.5zh18.5zm0-6.5h18.5a.75.75 0 0 1 .1 1.5H2.75a.75.75 0 0 1-.1-1.5zh18.5zm0-6.5h18.5a.75.75 0 0 1 .1 1.5H2.75a.75.75 0 0 1-.1-1.49zh18.5z"/></svg>
          </button>
          <img class="sidebar-header-icon" src="/brand/app-icon.svg" alt="" />
          <span class="sidebar-header-title">Photo Archive</span>
        </div>
        <!-- Home, pinned above the nav: it is where the app starts, not one of
             the tools at the bottom. -->
        <div id="nav-top"></div>
        <nav id="month-nav"></nav>
        <!-- Outside the scrolling nav: Generate, Save as PDF and Settings stay
             reachable at 61 months of scroll, which is the whole point of
             moving them out of a floating menu. -->
        <div id="nav-tools"></div>
      </aside>
      <div id="sidebar-resize" role="separator" aria-orientation="vertical" title="Drag to resize · double-click to reset"></div>

      <div id="main-column">
        <!-- Top titlebar & brand header for collapsed sidebar state / narrow screens -->
        <header id="main-header" class="main-header">
          <button id="nav-toggle-main" class="nav-toggle-btn" type="button" aria-label="Toggle navigation" title="Toggle navigation (Ctrl+B)">
            <svg class="nav-toggle-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2.75 18h18.5a.75.75 0 0 1 .1 1.5H2.75a.75.75 0 0 1-.1-1.5zh18.5zm0-6.5h18.5a.75.75 0 0 1 .1 1.5H2.75a.75.75 0 0 1-.1-1.5zh18.5zm0-6.5h18.5a.75.75 0 0 1 .1 1.5H2.75a.75.75 0 0 1-.1-1.49zh18.5z"/></svg>
          </button>
          <img class="sidebar-header-icon" src="/brand/app-icon.svg" alt="" />
          <span class="main-header-title">Photo Archive</span>
        </header>
        <main id="content"></main>
      </div>
    </div>

    <!--
      The search bar, in the title bar and therefore on every view.
      
      It used to be a block inside the home page, which made a global capability
      reachable only from one page — and left a tag clicked in the viewer with
      nowhere to go. Task Manager's shape: centred at the top of the window,
      results in a panel over whatever is underneath.
    -->
    <div id="search-bar" class="search-bar" hidden>
      <svg class="search-bar-icon" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M16.1 17.16a8 8 0 1 1 1.06-1.06l4.62 4.62a.75.75 0 1 1-1.06 1.06zM17.5 11a6.5 6.5 0 1 0-13 0 6.5 6.5 0 0 0 13 0"/></svg>
      <input id="search-input" class="search-input" type="search" autocomplete="off" spellcheck="false" />
      <button id="search-clear" class="search-bar-clear" type="button" aria-label="Clear"><svg class="search-clear-icon" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="m4.4 4.55.07-.08a.75.75 0 0 1 .98-.07l.08.07L12 10.94l6.47-6.47a.75.75 0 1 1 1.06 1.06L13.06 12l6.47 6.47c.27.27.3.68.07.98l-.07.08a.75.75 0 0 1-.98.07l-.08-.07L12 13.06l-6.47 6.47a.75.75 0 0 1-1.06-1.06L10.94 12 4.47 5.53a.75.75 0 0 1-.07-.98l.07-.08z"/></svg></button>
    </div>
    <div id="search-results" class="search-results" hidden></div>

    <div id="lightbox" class="lightbox" hidden>      <!-- Top header bar: Back button on top-left, drag region in desktop shell -->
      <header class="lightbox-header">
        <button id="lightbox-back" class="lightbox-back-btn" type="button" aria-label="Back" title="Back (Esc)">
          <svg class="lightbox-back-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10.73 19.8a.75.75 0 0 0 1.04-1.1l-6.25-5.95h14.73a.75.75 0 0 0 0-1.5H5.52l6.25-5.95a.75.75 0 0 0-1.04-1.1l-7.42 7.08a1 1 0 0 0 0 1.44z"/></svg>
          <span class="lightbox-back-text">Back</span>
        </button>
        <div class="lightbox-header-drag"></div>
      </header>
      <figure class="lightbox-figure">
        <div class="lightbox-stage">
          <img id="lightbox-img" alt="" draggable="false" />
          <video id="lightbox-video" controls playsinline preload="metadata" hidden></video>
          <div id="lightbox-spinner" class="spinner" hidden><span></span>Loading full resolution…</div>
          <!--
            The stage's only permanent controls: the photograph's own actions on
            the left of a hairline, the view controls on the right. Windows'
            command bar reads the same way (New / Copy / Delete | Sort / View),
            so the split needs no explaining. Copying is an action on this
            photograph, not another way to look at it.
          -->
          <div id="lightbox-zoom">
            <button id="lightbox-copy" class="lightbox-copy" type="button" data-copy="1" title="Copy this photo to the clipboard">
              <svg class="lightbox-copy-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8.5 8.5H5.25c-.97 0-1.75.78-1.75 1.75v8.5c0 .97.78 1.75 1.75 1.75h6c.97 0 1.75-.78 1.75-1.75V18h1.5v.75c0 1.8-1.46 3.25-3.25 3.25h-6A3.25 3.25 0 0 1 2 18.75v-8.5C2 8.45 3.46 7 5.25 7H8.5zM18.75 2C20.55 2 22 3.46 22 5.25v8.5c0 1.8-1.46 3.25-3.25 3.25h-6a3.25 3.25 0 0 1-3.25-3.25v-8.5C9.5 3.45 10.96 2 12.75 2zm-6 1.5c-.97 0-1.75.78-1.75 1.75v8.5c0 .97.78 1.75 1.75 1.75h6c.97 0 1.75-.78 1.75-1.75v-8.5c0-.97-.78-1.75-1.75-1.75z"/></svg>
              <span class="lightbox-copy-label" aria-live="polite">Copy</span>
            </button>
            <span class="lightbox-zoom-sep" aria-hidden="true"></span>
            <button type="button" data-zoom="out" aria-label="Zoom out">&minus;</button>
            <span class="zoom-level">100%</span>
            <button type="button" data-zoom="in" aria-label="Zoom in">+</button>
            <button type="button" data-zoom="fit">Fit</button>
          </div>
        </div>
        <!-- Two contexts, not one: what the card is about, then what this
             particular photograph is. An ordinary photo with no card shows only
             the second, and the section simply is not rendered. -->
        <aside id="lightbox-panel">
          <section id="lightbox-card" hidden></section>
          <section id="lightbox-photo"></section>
          <!-- The day's other photographs, one click away, under the text. -->
          <div id="lightbox-strip" hidden></div>
        </aside>
      </figure>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
