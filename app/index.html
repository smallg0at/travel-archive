<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Photo Archive</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="signin-banner" class="signin-banner" hidden>
      <span>Sign in to load your photos.</span>
      <button id="signin-button" type="button">Sign in with Microsoft</button>
    </div>

    <div id="app">
      <!-- The nav is rebuilt on every album render; the job panel must not be,
           or a finished job's result line and the form you just filled in are
           wiped the moment it completes. Hence a sibling host. -->
      <div id="sidebar">
        <nav id="month-nav"></nav>
      </div>
      <div id="sidebar-resize" role="separator" aria-orientation="vertical" title="Drag to resize · double-click to reset"></div>

      <div id="main-column">
        <main id="content"></main>
        <!-- Its own zone across the bottom of the content area, not a form
             wedged into the navigation column. -->
        <div id="job-drawer" hidden>
          <div id="job-host"></div>
        </div>
      </div>
      <!-- A burger that expands into a labelled list, bottom left and clear of
           the photo grid. Icons alone were unreadable; the labels are the point. -->
      <div id="menu">
        <button id="menu-toggle" type="button" aria-expanded="false" aria-controls="menu-items" aria-label="Menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div id="menu-items" hidden>
          <button type="button" id="menu-generate" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            <span>Generate</span>
          </button>
          <!-- Shown only on a view that has something to export — see print.ts. -->
          <button type="button" id="menu-print" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4v-6h16v6h-2M8 14h8v7H8z"/></svg>
            <span>Save as PDF</span>
          </button>
          <button type="button" id="menu-settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>
            <span>Settings</span>
          </button>
        </div>
      </div>

      <div id="settings-panel" hidden>
        <div class="settings-row"><span>Thumbnail size</span><div id="settings-density"></div></div>
        <div class="settings-row"><span>Sidebar</span><button type="button" id="settings-reset-sidebar">Reset width</button></div>
      </div>
    </div>

    <div id="lightbox" class="lightbox" hidden>
      <figure class="lightbox-figure">
        <div class="lightbox-stage">
          <img id="lightbox-img" alt="" />
          <div id="lightbox-spinner" class="spinner" hidden><span></span>Loading full resolution…</div>
        </div>
        <figcaption id="lightbox-caption"></figcaption>
      </figure>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
