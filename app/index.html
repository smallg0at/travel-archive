<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Photo Archive</title>
    <link rel="stylesheet" href="/src/style.css" />
    <script>
      // Before the stylesheet paints, not from a module. A reader who chose
      // dark on a light system would otherwise see the page render light and
      // then flip — the flash is more objectionable than the setting is useful.
      // Absence of the attribute means "system", which the media query handles.
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        /* storage blocked; the system preference still applies */
      }
    </script>
  </head>
  <body>
    <div id="signin-banner" class="signin-banner" hidden>
      <span>Sign in to load your photos.</span>
      <button id="signin-button" type="button">Sign in with Microsoft</button>
    </div>

    <div id="app">
      <!-- The nav is rebuilt on every album render; the job panel must not be,
           or a finished job's result line and the form you just filled in are
           wiped the moment it completes. Hence a sibling host. -->
      <div id="sidebar">
        <nav id="month-nav"></nav>
        <!-- Outside the scrolling nav: Generate, Save as PDF and Settings stay
             reachable at 61 months of scroll, which is the whole point of
             moving them out of a floating menu. -->
        <div id="nav-tools"></div>
      </div>
      <div id="sidebar-resize" role="separator" aria-orientation="vertical" title="Drag to resize · double-click to reset"></div>

      <div id="main-column">
        <main id="content"></main>
        <!-- Its own zone across the bottom of the content area, not a form
             wedged into the navigation column. -->
        <div id="job-drawer" hidden>
          <div id="job-host"></div>
        </div>
      </div>
    </div>

    <div id="lightbox" class="lightbox" hidden>
      <!-- The figure now fills most of the screen, so "click the backdrop to
           close" is no longer a big enough target to rely on. -->
      <button id="lightbox-close" type="button" aria-label="Close">&times;</button>
      <figure class="lightbox-figure">
        <div class="lightbox-stage">
          <img id="lightbox-img" alt="" />
          <div id="lightbox-spinner" class="spinner" hidden><span></span>Loading full resolution…</div>
        </div>
        <figcaption id="lightbox-caption"></figcaption>
      </figure>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
