<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the page draws under the notch and the home
         indicator, and mobile.css pads with env(safe-area-inset-*) instead of
         leaving dead bars the colour of the WebView behind it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#292929" media="(prefers-color-scheme: dark)" />
    <title>Photo Archive</title>
    <!-- The desktop stylesheet first, for what the phone shares with it: the
         six colour tokens and both themes, and the trip map and search, whose
         look lives there. Its only global rules are :root, * and body, and
         mobile.css overrides body; everything else in it is scoped to classes
         and ids this page does not use. -->
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/mobile/mobile.css" />
    <script>
      // Before the stylesheets paint, not from a module — the same reason as
      // the desktop page: a reader who chose dark would otherwise see a flash
      // of light first.
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        /* storage blocked; the system preference still applies */
      }
    </script>
  </head>
  <body class="m">
    <div id="m-banner" class="m-banner" hidden></div>
    <main id="m-screens"></main>
    <nav id="m-tabs" class="m-tabs" hidden></nav>
    <script type="module" src="/src/mobile/main.ts"></script>
  </body>
</html>
