<?xml version="1.0" encoding="UTF-8"?>
<!--
  Concept D, master, second pass.

  Structure taken from the reference frame (Nordkette above Innsbruck, shot from
  the meadow with the round stone wall), read as proportions rather than as a
  picture:

    sky        55% of the window height, deepest at the top right
    glare      upper left, where the sun sits just outside the frame
    ridge      one mass entering from the right edge at ~30% height and falling
               to ~55% at half width; its lit rim is the strongest line in the image
    scree      a pale fan under the ridge, right of centre
    meadow     lower third, rising to the right
    ring       the round stone wall, left of centre, on the meadow's crest
    path       pale, from the bottom edge curving to the right

  Fluent depth, layer by layer: contact shadow + wide ambient shadow under the
  card; a 1px inner highlight along its top edge; a soft inner shadow where the
  photograph meets the frame; a low-contrast vignette; the pin with a rim light,
  its own shadow, and a contact shadow on the card.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" role="img" aria-label="Photo Archive">
  <defs>
    <linearGradient id="card" x1="0.15" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.62" stop-color="#F7FAFC"/>
      <stop offset="1" stop-color="#E4EBF2"/>
    </linearGradient>
    <linearGradient id="sky" x1="0.65" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#2E9BE0"/>
      <stop offset="0.45" stop-color="#59BCEF"/>
      <stop offset="0.8" stop-color="#9*"/>
    </linearGradient>
    <linearGradient id="sky2" x1="0.6" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#2E9BE0"/>
      <stop offset="0.45" stop-color="#5BBEEF"/>
      <stop offset="1" stop-color="#B9E4F7"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0.2" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#7C8FA6"/>
      <stop offset="0.45" stop-color="#5E7288"/>
      <stop offset="1" stop-color="#46586D"/>
    </linearGradient>
    <linearGradient id="scree" x1="0.2" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#D6D2C2"/>
      <stop offset="1" stop-color="#AFA99A"/>
    </linearGradient>
    <linearGradient id="meadow" x1="0.1" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#8CBF55"/>
      <stop offset="0.55" stop-color="#6BA43C"/>
      <stop offset="1" stop-color="#4C7C29"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#C6BAA4"/>
      <stop offset="1" stop-color="#8C806C"/>
    </linearGradient>
    <linearGradient id="pin" x1="0.15" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#FF8B57"/>
      <stop offset="0.35" stop-color="#F0521A"/>
      <stop offset="0.75" stop-color="#D03104"/>
      <stop offset="1" stop-color="#A81F00"/>
    </linearGradient>
    <radialGradient id="glare" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#FFF6D8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFF6D8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="innerShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B2743" stop-opacity="0.28"/>
      <stop offset="0.18" stop-color="#0B2743" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#0B2743" stop-opacity="0"/>
      <stop offset="1" stop-color="#0B2743" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="topLight" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="view">
      <rect x="24" y="21" width="52" height="48" rx="5"/>
    </clipPath>
    <clipPath id="cardClip">
      <rect x="18" y="15" width="64" height="76" rx="9"/>
    </clipPath>

    <filter id="ambient" x="-40%" y="-30%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3.6" stdDeviation="4.6" flood-color="#061426" flood-opacity="0.26"/>
    </filter>
    <filter id="contact" x="-30%" y="-25%" width="160%" height="160%">
      <feDropShadow dx="-0.6" dy="1.3" stdDeviation="1.2" flood-color="#04101F" flood-opacity="0.34"/>
    </filter>
    <filter id="pinShadow" x="-70%" y="-50%" width="240%" height="230%">
      <feDropShadow dx="-2" dy="3.2" stdDeviation="2.8" flood-color="#0B1220" flood-opacity="0.42"/>
    </filter>
  </defs>

  <!-- Ground shadow, then the card itself with a tight contact shadow. -->
  <rect x="18" y="15" width="64" height="76" rx="9" fill="#000" opacity="0.01" filter="url(#ambient)"/>
  <rect x="18" y="15" width="64" height="76" rx="9" fill="url(#card)" filter="url(#contact)"/>

  <g clip-path="url(#cardClip)">
    <!-- Top-left highlight on the card's edge, as Fluent's acrylic cards have. -->
    <rect x="18" y="15" width="64" height="4" fill="url(#topLight)" opacity="0.75"/>
    <!-- Paper thickness along the bottom. -->
    <path d="M18 85.5 h64 v-2.5 a9 9 0 0 1 -9 9 h-46 a9 9 0 0 1 -9 -9 z" fill="#BFCAD6" opacity="0.55"/>
  </g>

  <g clip-path="url(#view)">
    <rect x="24" y="21" width="52" height="48" fill="url(#sky2)"/>

    <!-- glare, upper left, as in the reference -->
    <ellipse cx="31" cy="26" rx="17" ry="13" fill="url(#glare)"/>

    <!-- ridge: enters the right edge high, falls to about half width -->
    <path d="M76 29.4 C70.5 31.4 65.5 33.8 61 36.8 C56.5 39.8 52.5 43.2 49.4 47.2 L47.6 50.4 L47.6 58 H76 Z" fill="url(#ridge)"/>
    <path d="M76 29.4 C70.5 31.4 65.5 33.8 61 36.8 C58.4 38.5 55.9 40.5 53.6 42.7 L55.4 43.4 C57.8 41.2 60.3 39.3 62.9 37.7 C67 35.2 71.3 33.2 76 31.4 Z" fill="#B7C4D2" opacity="0.9"/>

    <!-- a second, softer fold behind it -->
    <path d="M76 33 C72 35 68 37.6 64.6 40.8 L66 41.8 C69.4 38.9 73.4 36.4 76 34.8 Z" fill="#C9D5E1" opacity="0.55"/>

    <!-- scree fan under the ridge -->
    <path d="M52.6 51.4 C60 49.6 68.4 49.4 76 51 V60 H52.6 Z" fill="url(#scree)" opacity="0.96"/>
    <path d="M54.4 52.6 C61 51.4 68 51.4 74 52.4" fill="none" stroke="#E6E1D2" stroke-width="0.6" opacity="0.6"/>

    <!-- meadow, rising to the right -->
    <path d="M24 53.2 C30 51.4 36 50.6 42 51.2 C49 51.9 57 53.4 64 54.6 C68.5 55.4 72.5 55.9 76 56 V69 H24 Z" fill="url(#meadow)"/>
    <!-- the slope's shadowed fold -->
    <path d="M24 60.8 C33 59.2 44 58.9 55 59.8 C63 60.4 70 61.2 76 62 V63.4 C70 62.6 63 61.8 55 61.2 C44 60.3 33 60.6 24 62.2 Z" fill="#3D6620" opacity="0.4"/>

    <!-- round stone wall on the crest -->
    <ellipse cx="35.2" cy="57.6" rx="9.2" ry="4.2" fill="#41691F" opacity="0.5"/>
    <ellipse cx="35.2" cy="56.4" rx="7" ry="3.1" fill="url(#stone)"/>
    <ellipse cx="35.2" cy="56" rx="5.1" ry="1.9" fill="#74A93E"/>
    <path d="M28.8 56.4 C30 53.9 32.4 52.8 35.6 52.8 C38.8 52.8 41.2 53.9 42.4 56.4" fill="none" stroke="#EFE6D2" stroke-width="0.7" stroke-linecap="round" opacity="0.9"/>
    <g fill="#6C6151" opacity="0.42">
      <circle cx="31.4" cy="55.6" r="0.32"/><circle cx="33.6" cy="55" r="0.32"/>
      <circle cx="35.9" cy="54.9" r="0.32"/><circle cx="38.2" cy="55.2" r="0.32"/>
    </g>

    <!-- path, from the bottom edge to the right -->
    <path d="M31 69 C35 65.6 41 63.4 48 62.6 C57 61.5 67 61.8 76 62.6" fill="none" stroke="#EBE6CE" stroke-width="2.1" stroke-linecap="round" opacity="0.82"/>
    <path d="M31 69.4 C35 66.4 41 64.3 48 63.6 C57 62.6 67 62.9 76 63.6" fill="none" stroke="#CFC8AC" stroke-width="0.7" opacity="0.5"/>

    <!-- inner shadow where the photograph meets the frame, and a faint vignette -->
    <rect x="24" y="21" width="52" height="48" fill="url(#innerShade)"/>
  </g>

  <!-- Caption margin -->
  <rect x="26" y="75.6" width="32" height="3.2" rx="1.6" fill="#63788C" opacity="0.9"/>
  <rect x="26" y="81.2" width="20" height="2.8" rx="1.4" fill="#63788C" opacity="0.5"/>
  <rect x="64.2" y="75.4" width="9.4" height="5.8" rx="2.2" fill="#F0A11E"/>
  <rect x="64.2" y="75.4" width="9.4" height="2.4" rx="1.2" fill="#FFC049" opacity="0.75"/>

  <!-- Pin: rim light on the upper left, soft shadow behind, contact shadow on the card -->
  <ellipse cx="77.6" cy="41.5" rx="6.4" ry="1.6" fill="#122033" opacity="0.22"/>
  <g filter="url(#pinShadow)" transform="rotate(12 77 21)">
    <path d="M77 9.6 a11.2 11.2 0 0 1 11.2 11.2 c0 7.6 -8.3 14 -11.2 20.1 c-2.9 -6.1 -11.2 -12.5 -11.2 -20.1 A11.2 11.2 0 0 1 77 9.6 Z" fill="url(#pin)"/>
  </g>
  <path d="M77 11.4 a9.4 9.4 0 0 0 -9.1 7.2 c1.6 -3.4 5 -5.7 9.1 -5.7 c1.5 0 2.9 0.3 4.1 0.9 a9.4 9.4 0 0 0 -4.1 -2.4 Z" fill="#FFD9C7" opacity="0.55" transform="rotate(12 77 21)"/>
  <circle cx="77" cy="20.8" r="4.1" fill="#FFFFFF"/>
  <circle cx="77" cy="20.4" r="3.4" fill="#F4F7FA"/>
</svg>
