<?xml version="1.0" encoding="UTF-8"?>
<!--
  Concept D, master.

  The window carries the Nordkette frame itself — crop x 0..760, y 330..1030,
  posterised to 14 colours at 8x and slightly lifted in saturation. Hand-drawn
  geometry was tried first and could not hold the ridge's jagged silhouette,
  which is the one thing that makes this range recognisable. Around it,
  everything is vector: the Polaroid, its two shadows, the top-edge highlight,
  the inner shadow at the photograph's edge, the caption margin, and the pin
  with its rim light and contact shadow.

  The window is mirrored relative to the frame: there the ridge enters from the
  right, exactly where the pin sits.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" role="img" aria-label="Photo Archive">
  <defs>
    <linearGradient id="card" x1="0.15" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.62" stop-color="#F7FAFC"/>
      <stop offset="1" stop-color="#E4EBF2"/>
    </linearGradient>
    <linearGradient id="pin" x1="0.15" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#FF8B57"/>
      <stop offset="0.35" stop-color="#F0521A"/>
      <stop offset="0.75" stop-color="#D03104"/>
      <stop offset="1" stop-color="#A81F00"/>
    </linearGradient>
    <linearGradient id="innerShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B2743" stop-opacity="0.22"/>
      <stop offset="0.14" stop-color="#0B2743" stop-opacity="0"/>
      <stop offset="0.88" stop-color="#0B2743" stop-opacity="0"/>
      <stop offset="1" stop-color="#0B2743" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="topLight" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="view">
      <rect x="24" y="21" width="52" height="48" rx="5"/>
    </clipPath>
    <clipPath id="cardClip">
      <rect x="18" y="15" width="64" height="76" rx="9"/>
    </clipPath>
    <filter id="ambient" x="-40%" y="-30%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3.6" stdDeviation="4.6" flood-color="#061426" flood-opacity="0.26"/>
    </filter>
    <filter id="contact" x="-30%" y="-25%" width="160%" height="160%">
      <feDropShadow dx="-0.6" dy="1.3" stdDeviation="1.2" flood-color="#04101F" flood-opacity="0.34"/>
    </filter>
    <filter id="pinShadow" x="-70%" y="-50%" width="240%" height="230%">
      <feDropShadow dx="-2" dy="3.2" stdDeviation="2.8" flood-color="#0B1220" flood-opacity="0.42"/>
    </filter>
    <linearGradient id="skyGrad" x1="0.06" y1="0" x2="0.88" y2="0.55">
      <stop offset="0" stop-color="#D2DCF0"/>
      <stop offset="0.46" stop-color="#84ACE6"/>
      <stop offset="1" stop-color="#457AC4"/>
    </linearGradient>
    <linearGradient id="rockGrad" x1="0.15" y1="0" x2="0.45" y2="1">
      <stop offset="0" stop-color="#7B7F8C"/>
      <stop offset="0.48" stop-color="#5B595B"/>
      <stop offset="1" stop-color="#413F47"/>
    </linearGradient>
    <linearGradient id="leftHillGrad" x1="0.15" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#69754D"/>
      <stop offset="0.55" stop-color="#4D552B"/>
      <stop offset="1" stop-color="#38401B"/>
    </linearGradient>
    <linearGradient id="rockRimGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#9CA2B0"/>
      <stop offset="1" stop-color="#D6DAE4"/>
    </linearGradient>
    <linearGradient id="rockShadowGrad" x1="0.1" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#474A5D"/>
      <stop offset="1" stop-color="#2B2C38"/>
    </linearGradient>
    <linearGradient id="ledgeGrad" x1="0.1" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#75803A"/>
      <stop offset="1" stop-color="#46501B"/>
    </linearGradient>
    <linearGradient id="screeGrad" x1="0.15" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#A4A6B1"/>
      <stop offset="0.5" stop-color="#8B868C"/>
      <stop offset="1" stop-color="#6E6B73"/>
    </linearGradient>
    <linearGradient id="meadowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#939C48"/>
      <stop offset="0.42" stop-color="#777D23"/>
      <stop offset="1" stop-color="#5B6215"/>
    </linearGradient>
    <linearGradient id="moundGrad" x1="0.12" y1="0" x2="0.42" y2="1">
      <stop offset="0" stop-color="#6A7636"/>
      <stop offset="0.55" stop-color="#4E5824"/>
      <stop offset="1" stop-color="#364015"/>
    </linearGradient>
    <linearGradient id="moundCrestGrad" x1="0" y1="0.2" x2="1" y2="0.4">
      <stop offset="0" stop-color="#BCC95E"/>
      <stop offset="1" stop-color="#95A232"/>
    </linearGradient>
    <linearGradient id="wallShadowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#252B2D"/>
      <stop offset="1" stop-color="#191E20"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0.1" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#585E6F"/>
      <stop offset="0.5" stop-color="#40424F"/>
      <stop offset="1" stop-color="#2D2F3B"/>
    </linearGradient>
    <linearGradient id="wallTopGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B0B4C2"/>
      <stop offset="1" stop-color="#8A8C98"/>
    </linearGradient>
    <linearGradient id="pathGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCE2EC"/>
      <stop offset="1" stop-color="#ACB6C4"/>
    </linearGradient>
    <linearGradient id="pathEdgeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1F5FB"/>
      <stop offset="1" stop-color="#D7E0EC"/>
    </linearGradient>
    <linearGradient id="backCard" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#E9EEF4"/>
      <stop offset="1" stop-color="#C6D1DC"/>
    </linearGradient>
    <linearGradient id="backPhoto" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#B9C6D4"/>
      <stop offset="1" stop-color="#93A3B4"/>
    </linearGradient>
    <filter id="backShadow" x="-40%" y="-30%" width="180%" height="170%">
      <feDropShadow dx="0" dy="2.2" stdDeviation="3.2" flood-color="#061426" flood-opacity="0.24"/>
    </filter>
  </defs>

  <!-- Back card, tilted, as in the original Concept D: the front card sits on
       it, which is what gives the mark its thickness. -->
  <g transform="rotate(-8.5 42 46)" filter="url(#backShadow)">
    <rect x="15" y="13" width="56" height="66" rx="7" fill="url(#backCard)"/>
    <rect x="19.5" y="18.5" width="47" height="45" rx="4.5" fill="url(#backPhoto)"/>
  </g>
  <rect x="18" y="15" width="64" height="76" rx="9" fill="#000" opacity="0.01" filter="url(#ambient)"/>
  <rect x="18" y="15" width="64" height="76" rx="9" fill="url(#card)" filter="url(#contact)"/>

  <g clip-path="url(#cardClip)">
    <rect x="18" y="15" width="64" height="4" fill="url(#topLight)" opacity="0.75"/>
    <path d="M18 85.5 h64 v-2.5 a9 9 0 0 1 -9 9 h-46 a9 9 0 0 1 -9 -9 z" fill="#BFCAD6" opacity="0.55"/>
  </g>

  <g clip-path="url(#view)">
    <g transform="translate(24 21)">
      <rect x="0" y="0" width="52" height="28" fill="url(#skyGrad)"/>
      <path d="M0,25.6 L6,25.8 L12,24.4 L18,24.2 L24,23.2 L30,20.4 L36,17.0 L42,13.2 L48,10.6 L52,8.8 V34.5 L26,34.0 L0,33.0 Z" fill="url(#rockGrad)"/>
      <path d="M0,25.6 L6,25.8 L12,24.4 L18,24.2 L24,23.2 Q23.8,26.8 21.5,31.5 L0,33.0 Z" fill="url(#leftHillGrad)"/>
      <path d="M24,23.2 L30,20.4 L36,17.0 L42,13.2 L48,10.6 L52,8.8 V9.6 L48,11.3 L42,13.9 L36,17.6 L30,20.9 Z" fill="url(#rockRimGrad)"/>
      <path d="M26.5,26.0 L31.2,21.5 L35.2,18.8 L37.2,22.2 L33.2,26.8 L27.2,28.5 Z M39.2,15.8 L44.2,13.2 L48.2,11.5 L51.2,16.5 L47.2,21.5 L42.2,22.0 L40.2,19.0 Z" fill="url(#rockShadowGrad)"/>
      <path d="M35.4,22.8 L39.4,19.6 L40.8,21.2 L37.2,24.2 Z M43.4,20.6 L46.8,18.4 L47.8,20.0 L44.6,22.0 Z" fill="url(#ledgeGrad)"/>
      <path d="M26,29.5 L31.5,26.8 L37.2,24.2 L43.5,25.0 L48.0,22.8 L52,20.5 V37.5 L42,35.5 L32,34.0 L25,33.0 Z" fill="url(#screeGrad)"/>
      <path d="M0,32.5 Q13,31.5 26,32.6 Q39,34.2 52,37.2 V48 H0 Z" fill="url(#meadowGrad)"/>
      <path d="M0,35.4 Q6,30.2 15,28.4 Q22,30.2 27.6,36.2 L26,36.5 Q14,35.0 0,35.6 Z" fill="url(#moundGrad)"/>
      <path d="M0,33.4 Q7.5,29.3 15.2,28.2 Q18.0,28.7 20.5,30.4 Q17.6,29.4 15.0,29.3 Q8.0,30.5 0,35.2 Z" fill="url(#moundCrestGrad)"/>
      <path d="M0,36.4 Q13,35.8 26.2,36.4 L30.6,39.2 L27.6,39.3 L24.5,38.8 Q12,39.0 0,38.8 Z" fill="url(#wallShadowGrad)"/>
      <g>
        <rect x="-1.2" y="35.4" width="8.0" height="3.2" rx="1.4" transform="rotate(-2 3 37)" fill="url(#wallGrad)"/>
        <rect x="6.5" y="35.0" width="7.8" height="3.4" rx="1.4" transform="rotate(-0.5 10.4 36.7)" fill="url(#wallGrad)"/>
        <rect x="14.0" y="35.1" width="7.6" height="3.4" rx="1.4" transform="rotate(2 17.8 36.8)" fill="url(#wallGrad)"/>
        <rect x="21.3" y="35.6" width="6.6" height="3.0" rx="1.4" transform="rotate(6.5 24.6 37.1)" fill="url(#wallGrad)"/>
        <path d="M-0.5,35.7 Q3.0,35.4 6.2,35.5 M7.3,35.3 Q10.4,35.0 13.5,35.2 M14.8,35.3 Q17.8,35.3 20.8,35.6 M22.0,35.8 Q24.6,36.0 27.0,36.6" fill="none" stroke="url(#wallTopGrad)" stroke-width="0.65" stroke-linecap="round"/>
      </g>
      <path d="M52,43.8 Q44,40.4 35.8,37.2 Q38.8,36.6 42.5,36.0 Q43.2,35.6 42.2,35.3 Q37.5,34.5 32.5,33.8 L32.0,34.1 Q36.2,34.9 40.5,35.6 Q36.8,36.3 33.8,36.9 Q33.2,37.2 34.0,37.6 Q41.5,41.0 48.2,44.2 H52 Z" fill="url(#pathGrad)"/>
      <path d="M52,43.8 Q44,40.4 35.8,37.2 Q38.8,36.6 42.5,36.0 Q43.1,35.6 42.2,35.3 Q37.5,34.5 32.5,33.8" fill="none" stroke="url(#pathEdgeGrad)" stroke-width="0.42" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <rect x="24" y="21" width="52" height="48" fill="url(#innerShade)"/>
  </g>

  <rect x="26" y="75.6" width="32" height="3.2" rx="1.6" fill="#63788C" opacity="0.9"/>
  <rect x="26" y="81.2" width="20" height="2.8" rx="1.4" fill="#63788C" opacity="0.5"/>
  <rect x="64.2" y="75.4" width="9.4" height="5.8" rx="2.2" fill="#F0A11E"/>
  <rect x="64.2" y="75.4" width="9.4" height="2.4" rx="1.2" fill="#FFC049" opacity="0.75"/>

  <ellipse cx="77.6" cy="41.5" rx="6.2" ry="1.5" fill="#122033" opacity="0.2"/>
  <g filter="url(#pinShadow)" transform="rotate(12 77 21)">
    <path d="M77 9.6 a11.2 11.2 0 0 1 11.2 11.2 c0 7.6 -8.3 14 -11.2 20.1 c-2.9 -6.1 -11.2 -12.5 -11.2 -20.1 A11.2 11.2 0 0 1 77 9.6 Z" fill="url(#pin)"/>
  </g>
  <path d="M77 11.4 a9.4 9.4 0 0 0 -9.1 7.2 c1.6 -3.4 5 -5.7 9.1 -5.7 c1.5 0 2.9 0.3 4.1 0.9 a9.4 9.4 0 0 0 -4.1 -2.4 Z" fill="#FFD9C7" opacity="0.5" transform="rotate(12 77 21)"/>
  <circle cx="77" cy="20.8" r="4.1" fill="#FFFFFF"/>
  <circle cx="77" cy="20.4" r="3.4" fill="#F4F7FA"/>
</svg>
