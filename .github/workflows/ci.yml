name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # No secrets are configured on purpose: unit tests must pass with zero
    # credentials. Any job needing OneDrive/AI access must be a separate,
    # manually-triggered workflow, never part of push/PR.
    steps:
      - uses: actions/checkout@v4

      - name: Fail if private files are tracked
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env$|token-cache|redaction-terms\.json|(^|/)pipeline/data/' || true)
          if [ -n "$tracked" ]; then
            echo "Private files must not be committed:"
            echo "$tracked"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run --workspace @travel-archive/pipeline typecheck
      - run: npm run --workspace @travel-archive/app typecheck
      # The desktop shell was the one workspace CI did not check, and a commit
      # that did not compile went through it: `app.on("unresponsive")` is not an
      # `app` event, and nothing said so until a local build. It needs no display
      # to typecheck — electron's own types come from npm ci.
      - run: npm run --workspace @travel-archive/desktop typecheck
      - run: npm run --workspace @travel-archive/pipeline test
      - run: npm run --workspace @travel-archive/pipeline build
